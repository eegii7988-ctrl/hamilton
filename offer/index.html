<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}</style></head><body><title>Hamilton Personal Offer</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c2233;--mut:#6b7080;--line:#e3dfd5;--navy:#1f2f5c;--gold:#b0893c;--onNavy:#f6f4ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b1f2a;--ink:#e8e9ee;--mut:#9aa0b2;--line:#2b3040;--navy:#2a3b6e;--gold:#d2ad62;--onNavy:#f1efe8}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b1f2a;--ink:#e8e9ee;--mut:#9aa0b2;--line:#2b3040;--navy:#2a3b6e;--gold:#d2ad62;--onNavy:#f1efe8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.serif{font-family:Georgia,"Times New Roman",serif}a{color:inherit}
/* builder */
.bw{max-width:980px;margin:0 auto;padding:22px 16px 60px}.bw h1{font:600 24px Georgia,serif;margin:0 0 4px}.eb{font:600 11px system-ui;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:16px}@media(max-width:780px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{display:inline-block;padding:10px 16px;border-radius:9px;border:1px solid var(--navy);background:var(--navy);color:var(--onNavy);font:inherit;cursor:pointer;text-decoration:none}.btn.g{background:transparent;color:var(--ink);border-color:var(--line)}
.link{word-break:break-all;font-size:12px;color:var(--mut);background:var(--bg);border-radius:8px;padding:8px;margin:10px 0}
#qr{background:#fff;border-radius:10px;padding:10px;display:flex;justify-content:center}#qr svg{width:100%;max-width:240px;height:auto}
.hint{font-size:12px;color:var(--mut);margin-top:10px}
/* client */
.hero{position:relative;min-height:78vh;display:flex;align-items:flex-end;color:#fff;background:#111 center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 30%,#000c 100%)}
.hero .in{position:relative;max-width:980px;margin:0 auto;width:100%;padding:28px 16px 40px}
.hero .eb{color:#e5c47c}.hero h1{font:400 clamp(30px,6vw,54px)/1.08 Georgia,serif;margin:8px 0 10px}.hero p{max-width:560px;opacity:.9;margin:0}
.logo{position:absolute;top:18px;left:16px;right:16px;max-width:980px;margin:0 auto;font:600 13px system-ui;letter-spacing:3px;color:#fff;z-index:1}
.sec{max-width:980px;margin:0 auto;padding:36px 16px}
.sec h2{font:400 28px/1.2 Georgia,serif;margin:6px 0 16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.fact b{display:block;font:600 24px Georgia,serif;font-variant-numeric:tabular-nums}.fact span{font-size:12px;color:var(--mut)}
.pay{background:var(--navy);color:var(--onNavy);border-radius:16px;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:14px}.pay b{display:block;font:600 22px Georgia,serif}.pay span{font-size:12px;opacity:.75}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.act{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none}.act b{display:block;margin-bottom:3px}.act span{font-size:13px;color:var(--mut)}.act:hover{border-color:var(--gold)}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:180px;gap:8px}.gal div{border-radius:12px;background:center/cover}.gal div:first-child{grid-row:span 2}@media(max-width:600px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:130px}.gal div:first-child{grid-column:span 2;grid-row:auto}}
.note{border-left:3px solid var(--gold);padding:4px 0 4px 14px;font:italic 17px/1.5 Georgia,serif;margin:0}
.mgr{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.small{font-size:12px;color:var(--mut)}
</style>

<script>//---------------------------------------------------------------------
//

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

function builder(){document.title='Hamilton Personal Offer';
$('app').innerHTML=`<div class="bw"><div class="eb">Hamilton Gate Park</div><h1>Харилцагчийн хувийн хуудас</h1><p class="small" style="margin:0">Харилцагч бүрт тусгай линк үүсгэнэ. Мэдээлэл ямар нэг сервер дээр хадгалагдахгүй, зөвхөн линк дотор явна.</p>
<div class="bgrid"><div class="card"><label>Харилцагчийн нэр</label><input id="n" placeholder="ж: Бат-Эрдэнэ">
<div class="r3"><div><label>Төрөл</label><select id="c"><option value="res">Орон сууц</option><option value="off">Оффис</option><option value="com">Худалдаа</option></select></div><div><label>Давхар</label><select id="f"></select></div><div><label>Өрөө</label><select id="i"></select></div></div>
<div class="r2"><div><label>Үнэ (₮, хоосон бол "Тохиролцоно")</label><input id="pr" inputmode="numeric" placeholder="ж: 480000000"></div><div><label>Урьдчилгаа %</label><input id="dp" type="number" min="10" max="100" value="10"></div></div>
<label>Хувийн тэмдэглэл (сонголттой)</label><textarea id="t" rows="2" placeholder="ж: Таны хүссэн зүүн өмнө зүг харсан, нартай байр."></textarea>
<div class="r2"><div><label>Менежерийн нэр</label><input id="m"></div><div><label>Утас</label><input id="p" inputmode="tel" placeholder="ж: 9911 2233"></div></div>
<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" id="open" target="_blank">Хуудсыг урьдчилж харах</a><button class="btn g" id="copy">Линк хуулах</button></div></div>
<div class="card"><div class="eb" style="margin-bottom:8px">Харилцагчид өгөх QR</div><div id="qr"></div><div class="link" id="lk"></div><p class="hint">Энэ линкийг эсвэл QR-ыг харилцагчид илгээнэ. Нэвтрэх шаардлагагүйгээр шууд нээгдэнэ.</p></div></div></div>`;
const fill=()=>{const c=$('c').value,fs=[...new Set(INV.filter(u=>u[0]==c).map(u=>u[1]))].sort((a,b)=>a-b),fv=$('f').value;
$('f').innerHTML=fs.map(f=>`<option ${f==fv?'selected':''}>${f}</option>`).join('');fillI()};
const fillI=()=>{const c=$('c').value,f=+$('f').value;$('i').innerHTML=INV.filter(u=>u[0]==c&&u[1]==f).map(u=>`<option value="${esc(key(u))}">${esc(u[2])}${u[3]?' · '+u[3]+' м²':''}</option>`).join('');upd()};
const upd=()=>{const q=new URLSearchParams();const v=id=>$(id).value.trim();q.set('u',$('i').value);if(v('n'))q.set('n',v('n'));const pr=v('pr').replace(/\D/g,'');if(pr)q.set('pr',pr);
const dp=Math.min(100,Math.max(10,+v('dp')||10));if(dp!=10)q.set('dp',dp);['t','m','p'].forEach(k=>{if(v(k))q.set(k,v(k))});
const base=location.href.split("#")[0],url=base+'#'+q.toString();$('lk').textContent=url;$('open').href=url;
try{const qr=qrcode(0,'M');qr.addData(url);qr.make();$('qr').innerHTML=qr.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){$('qr').textContent='QR үүсгэж чадсангүй'}};
$('c').onchange=fill;$('f').onchange=fillI;$('i').onchange=upd;['n','pr','dp','t','m','p'].forEach(id=>$(id).oninput=upd);
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('lk').textContent);$('copy').textContent='Хуулагдлаа ✓'}catch(e){$('copy').textContent='Линкийг гараар хуулна уу'}setTimeout(()=>$('copy').textContent='Линк хуулах',1800)};
fill()}
function route(){const q=new URLSearchParams(location.hash.slice(1));q.get('u')?client(q):builder();scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
<a href="../" aria-label="Нүүр хуудас" style="position:fixed;left:12px;bottom:12px;z-index:2147483000;display:flex;align-items:center;gap:8px;padding:8px 13px 8px 10px;background:rgba(10,14,26,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(231,207,155,.45);color:#e7cf9b;font:600 10px/1 Montserrat,system-ui,sans-serif;letter-spacing:.28em;text-decoration:none;border-radius:2px">&#8592; HAMILTON</a></body></html>
