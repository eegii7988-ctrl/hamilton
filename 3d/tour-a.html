<script>
/* ============================================================
   ТӨСЛИЙН МЭДЭЭЛЭЛ — илгээхээсээ өмнө энд засна уу
   (Project details — edit these before sending to a client)
   ============================================================ */
window.TOUR_CONFIG = {
  project: 'Hamilton Residence',    // Project name
  address: 'A төрлийн байр · 13–16-р давхар · 2 өрөө', // Address
  price:   '',                     // Price, e.g. '450,000,000 ₮'
  agent:   'Hamilton борлуулалт',  // Your name
  phone:   '',                     // Your phone, e.g. '+976 9911 2233'
  area:    75.4,                   // Official floor area in m² (null = measured from the plan)
  style:   'modern',               // Opening look: 'modern' | 'scandi' | 'lux'
  startTime: 15.5,                 // Opening time of day (5.5 – 23)
  planUpFaces: 0,                  // Compass direction the top of the plan faces (0 N, 90 E, 180 S, 270 W)
  music: true                      // Soft background music on by default
};
// opened from the Hamilton sales model: tour-a.html?unit=14A&st=free names the unit and its sales status
(function () { const q = new URLSearchParams(location.search), u = q.get('unit'), st = { free: 'Сул', hold: 'Захиалсан', sold: 'Зарагдсан' }[q.get('st')];
  if (u && /^\d{1,2}A$/.test(u)) { TOUR_CONFIG.project = u + ' байр'; TOUR_CONFIG.address = 'Hamilton · ' + parseInt(u) + '-р давхар · A төрөл · 2 өрөө' + (st ? ' · ' + st : ''); } })();
</script>
<style>
  :root{--ink:#24201c;--muted:#6f655b;--accent:#9a7350;--paper:rgba(252,250,246,.9);--dark:#2b2622;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e4da;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  button,a.btn{font:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;text-decoration:none}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif}
  .hud{position:fixed;z-index:5}
  .card{background:var(--paper);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:14px;box-shadow:0 6px 24px rgba(40,30,20,.14)}
  .hidden{display:none!important}
  /* top-left brand */
  #hudL{top:calc(14px + var(--sat));left:14px}
  #brand{padding:10px 15px;max-width:340px}
  #brand b{display:block;font-size:16px;font-weight:600}
  #brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  #room{font-size:13px;margin-top:6px;font-weight:600;color:var(--accent)}
  /* top-right controls */
  #hudR{top:calc(14px + var(--sat));right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .btnrow{display:flex;gap:8px;align-items:center}
  .pill{background:var(--dark);color:#fff;border-radius:999px;padding:11px 18px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22);white-space:nowrap}
  .pill:hover{background:#463c33}
  .icon{width:42px;height:42px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:17px;line-height:42px;padding:0;box-shadow:0 6px 18px rgba(40,30,20,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .icon:hover{background:#fff}
  #panel{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #styles{display:flex;gap:4px;padding:5px}
  #styles button{background:transparent;color:var(--ink);padding:8px 12px;font-size:13px;border-radius:9px}
  #styles button:hover{background:rgba(0,0,0,.06)}
  #styles button.on{background:var(--dark);color:#fff}
  #sun{font-size:13px;display:flex;align-items:center;gap:10px;padding:9px 14px}
  #sun input{width:170px;accent-color:var(--accent)}
  #timeLbl{font-weight:600;color:var(--accent);min-width:122px;font-size:12.5px}
  .mobile-only{display:none}
  /* bottom help */
  #help{bottom:calc(14px + var(--sab));left:50%;transform:translateX(-50%);font-size:12.5px;text-align:center;white-space:nowrap;padding:9px 14px;transition:opacity .8s}
  #help.fade{opacity:0;pointer-events:none}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35);z-index:4;pointer-events:none}
  /* tour card */
  #tourCard{left:24px;bottom:calc(24px + var(--sab));width:min(410px,calc(100vw - 48px));padding:16px 20px 14px;transition:opacity .55s ease,transform .55s ease}
  #tourCard.off{opacity:0;transform:translateY(14px);pointer-events:none}
  .tc-step{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .tc-name{font-size:27px;margin:3px 0 4px;line-height:1.1}

  .c-proj{font-size:13px;color:var(--muted)}
  .c-phone{display:block;font-size:20px;font-weight:600;color:var(--ink);margin:16px 0 18px;letter-spacing:.02em}
  .sheet .btn{display:block;width:100%;padding:14px;border-radius:999px;font-weight:700;margin-top:8px;font-size:15px}
  .sheet .call{background:var(--dark);color:#fff}
  .sheet .copy{background:rgba(0,0,0,.06);color:var(--ink)}

  #joy{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);z-index:6;pointer-events:none;box-shadow:0 0 20px rgba(0,0,0,.15)}
  #knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.25)}
  /* loading */
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-size:14px;z-index:30;background:#24201c;color:#efe7dc;text-align:center;padding:24px;transition:opacity .6s}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#efe7dc;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  body.welcome .hud,body.welcome #cross{display:none!important}
  body.touring #help,body.touring #panel{display:none!important}
  /* phones */
  @media (max-width:700px){
    #hudL{left:10px} #hudR{right:10px}
    #brand{max-width:calc(100vw - 230px);padding:8px 12px} #brand b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #brand span{display:none} #room{font-size:12px;margin-top:3px}
    .mobile-only{display:inline-block}
    .pill{padding:0;width:42px;height:42px;font-size:15px} .pill span{display:none}
    .btnrow{gap:6px} .icon{width:40px;height:40px;line-height:40px;font-size:16px}
    #panel{display:none;position:fixed;top:calc(64px + var(--sat));left:10px;right:10px;align-items:stretch}
    #panel.open{display:flex}
    #styles{justify-content:space-between} #styles button{flex:1;padding:9px 4px;font-size:12.5px}
    #sun input{flex:1;width:auto} #timeLbl{min-width:0}
    #tourCard{left:10px;right:10px;bottom:calc(10px + var(--sab));width:auto;padding:14px 16px 12px}
    .tc-name{font-size:21px} .tc-point{font-size:13.5px}
    #help{font-size:12px;white-space:normal;width:calc(100vw - 20px);bottom:calc(10px + var(--sab))}
    #welcome{align-items:flex-end;padding:0;background:linear-gradient(0deg,rgba(24,20,17,.9) 0%,rgba(24,20,17,.62) 55%,rgba(24,20,17,0) 100%)}
    .wcard{padding:24px 22px calc(26px + var(--sab));max-width:none;width:100%}
    #welcome h1{font-size:36px;margin:8px 0}
    .price{margin:14px 0 4px;font-size:21px} .facts{margin-bottom:20px}
    .wprimary{width:100%;text-align:center} .wghost{flex:1;text-align:center}
  }
</style>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   PLAN → WORLD
   All plan coordinates below are pixels measured on the uploaded
   2048×2048 floor plan. Scale comes from the bedroom dimension strings
   (15′-1″ ≈ 465 px) → 0.00988 m per px. +x = plan right, +z = plan down.
   ===================================================================== */
const S = 0.01, CX = 600, CZ = 600, H = 2.8, EYE = 1.6;   // plan units = cm (Hamilton drawing, M1:100)
const X = p => (p - CX) * S, Z = p => (p - CZ) * S, L = p => p * S;

let seed = 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const PI = Math.PI;

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // PCF + radius = soft penumbra, cheaper than PCFSoft
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
let dirty = true, timeReady = false, northDeg = 270, styleExposure = 1, lampK = 1, timeNow = 15.5, timeTarget = 15.5, lastSunKey = '', probeDirty = true, probeTimer = 0;
scene.fog = new THREE.Fog(0xe6e2d8, 45, 170);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.42;

/* ---------------- procedural textures ---------------- */
function tex(w, h, draw, world, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (world) t.repeat.set(1 / world, 1 / world);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function speckle(g, w, h, n, a, rgb, smin = 0.6, smax = 2.4) {
  for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${rgb},${rr(0, a)})`; const s = rr(smin, smax); g.fillRect(rr(0, w), rr(0, h), s, s); }
}
function blotch(g, w, h, n, a, rgb, rmin, rmax) {
  for (let i = 0; i < n; i++) {
    const x = rr(0, w), y = rr(0, h), r = rr(rmin, rmax);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${rgb},${rr(0, a)})`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
}
// Wide-plank oak floor (8 planks × 0.19 m)
const makePlank = (P) => tex(1024, 1024, (g, s) => {
  const n = 8, pw = s / n;
  for (let i = 0; i < n; i++) {
    const start = rr(0, s); let covered = 0;
    while (covered < s - 1) {
      const len = Math.min(rr(0.38, 0.8) * s, s - covered);
      const hue = rr(...P.h), sat = rr(...P.s), lit = rr(...P.l);
      const draw = yy => {
        g.fillStyle = `hsl(${hue},${sat}%,${lit}%)`; g.fillRect(i * pw, yy, pw, len);
        for (let k = 0; k < 28; k++) {
          g.strokeStyle = `rgba(${rr(85, 125) | 0},${rr(52, 78) | 0},32,${rr(0.04, 0.14)})`; g.lineWidth = rr(0.5, 1.8);
          g.beginPath(); let x = i * pw + rr(3, pw - 3); g.moveTo(x, yy);
          for (let t = 0; t <= len; t += 14) { x += rr(-0.8, 0.8); x = Math.max(i * pw + 1, Math.min(i * pw + pw - 1, x)); g.lineTo(x, yy + t); }
          g.stroke();
        }
        if (rnd() < 0.18) { g.fillStyle = 'rgba(95,58,28,0.35)'; g.beginPath(); g.ellipse(i * pw + rr(12, pw - 12), yy + rr(12, Math.max(13, len - 12)), rr(2, 4), rr(6, 13), 0, 0, 7); g.fill(); }
        g.strokeStyle = 'rgba(72,46,26,0.5)'; g.lineWidth = 1.5; g.strokeRect(i * pw + 0.75, yy + 0.75, pw - 1.5, len - 1.5);
      };
      const yy = (start + covered) % s; const sd = seed; draw(yy); if (yy + len > s) { seed = sd; draw(yy - s); }
      covered += len;
    }
  }
}, 1.52);
const plankTex = makePlank({ h: [29, 36], s: [30, 42], l: [61, 71] });
const grainTex = tex(512, 512, (g, s) => {
  g.fillStyle = '#efe2cf'; g.fillRect(0, 0, s, s); blotch(g, s, s, 40, 0.08, '160,120,80', 20, 90);
  for (let k = 0; k < 170; k++) {
    g.strokeStyle = `rgba(${rr(120, 165) | 0},${rr(84, 112) | 0},60,${rr(0.06, 0.22)})`; g.lineWidth = rr(0.5, 2.2);
    g.beginPath(); let y = rr(0, s); g.moveTo(0, y);
    for (let x = 0; x <= s; x += 12) { y += Math.sin(x * 0.02 + k) * 0.5 + rr(-0.5, 0.5); g.lineTo(x, y); }
    g.stroke();
  }
}, 0.9);
const fabricTex = tex(256, 256, (g, s) => {
